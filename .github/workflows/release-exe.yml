name: Build & Publish Windows .exe to GitHub Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi GitHub Release (contoh: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-windows-exe:
    name: Build & Release whatsapp-rust.exe (WhatsApp Web Rust Wrapper)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile Standalone whatsapp-rust.exe (WhatsApp Web Wrapper)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Portable .exe, ZIP & SHA-256 Checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $exePath = "target/x86_64-pc-windows-msvc/release/whatsapp-rust.exe"
          Copy-Item $exePath "dist-release/whatsapp-rust.exe"
          Copy-Item "README.md" "dist-release/README.md"

          # Generate SHA256 Checksum
          $hash = (Get-FileHash "dist-release/whatsapp-rust.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  whatsapp-rust.exe" | Out-File -FilePath "dist-release/whatsapp-rust.exe.sha256" -Encoding utf8

          # Create Portable ZIP Archive
          Compress-Archive -Path "dist-release/whatsapp-rust.exe", "dist-release/README.md", "dist-release/whatsapp-rust.exe.sha256" -DestinationPath "dist-release/whatsapp-rust-win64-portable.zip" -Force

          Write-Host "=== Artefak GitHub Release Siap ==="
          Get-ChildItem dist-release

      - name: Upload Build Artifact to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-rust-win64-exe
          path: |
            dist-release/whatsapp-rust.exe
            dist-release/whatsapp-rust-win64-portable.zip
            dist-release/whatsapp-rust.exe.sha256
          if-no-files-found: error

      - name: Publish Binary to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          name: "WhatsApp Web Rust Wrapper (${{ github.event.inputs.release_tag || 'v1.0.0' }}) — Windows 64-bit (.exe)"
          body: |
            ## WhatsApp Web Rust Wrapper — Standalone Windows 64-bit (`.exe`)
            Aplikasi `.exe` ringan berbasis **Rust (`tao` + `wry` OS WebView2)** yang membuka langsung **`https://web.whatsapp.com`** secara penuh tanpa perlu membuka browser atau menginstal aplikasi Electron yang berat.

            ### Fitur Utama `whatsapp-rust.exe`:
            - **100% WhatsApp Web Asli (`https://web.whatsapp.com`)**: Semua fitur resmi WhatsApp Web (QR Login, Chat, Voice Note, Stiker, Grup, Saluran) berjalan persis seperti aslinya.
            - **Sesi Login Tersimpan Permanen**: Data login disimpan otomatis di `%LOCALAPPDATA%\WhatsAppRust\webview2-profile` sehingga cukup scan QR satu kali saja.
            - **Tampilan Full-Window (Tanpa Margin Browser)**: Menginjeksi CSS ringan agar tampilan WhatsApp Web memenuhi 100% ukuran jendela aplikasi `.exe`.
            - **Ukuran File `.exe` Ekstra Kecil (`~1.8 MB`)**: Menggunakan engine WebView2 bawaan Windows 10/11 tanpa membundel ratusan MB file Chromium.
          draft: false
          prerelease: false
          files: |
            dist-release/whatsapp-rust.exe
            dist-release/whatsapp-rust-win64-portable.zip
            dist-release/whatsapp-rust.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
