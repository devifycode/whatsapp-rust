name: Build & Publish Windows Installer & .exe to GitHub Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi GitHub Release (contoh: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-windows-exe:
    name: Build WhatsApp-Rust-Setup.exe & Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile Standalone whatsapp-rust.exe (With Custom Icon)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Windows Installer (WhatsApp-Rust-Setup.exe via NSIS)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $exePath = "target/x86_64-pc-windows-msvc/release/whatsapp-rust.exe"
          Copy-Item $exePath "dist-release/whatsapp-rust.exe"
          Copy-Item "assets/icon.ico" "dist-release/icon.ico"
          Copy-Item "README.md" "dist-release/README.md"

          # Compile NSIS Installer (WhatsApp-Rust-Setup.exe) with Directory Picker
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $makensis) {
            & $makensis installer.nsi
          } else {
            makensis installer.nsi
          }

          # Generate SHA256 Checksums
          $hashSetup = (Get-FileHash "dist-release/WhatsApp-Rust-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          $hashExe = (Get-FileHash "dist-release/whatsapp-rust.exe" -Algorithm SHA256).Hash.ToLower()
          "$hashSetup  WhatsApp-Rust-Setup.exe`n$hashExe  whatsapp-rust.exe" | Out-File -FilePath "dist-release/SHA256SUMS.txt" -Encoding utf8

          # Create Portable ZIP Archive
          Compress-Archive -Path "dist-release/whatsapp-rust.exe", "dist-release/icon.ico", "dist-release/README.md", "dist-release/SHA256SUMS.txt" -DestinationPath "dist-release/whatsapp-rust-win64-portable.zip" -Force

          Write-Host "=== Artefak GitHub Release Siap ==="
          Get-ChildItem dist-release

      - name: Upload Build Artifacts to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-rust-win64-installer-and-exe
          path: |
            dist-release/WhatsApp-Rust-Setup.exe
            dist-release/whatsapp-rust.exe
            dist-release/whatsapp-rust-win64-portable.zip
            dist-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Installer & Binary to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          name: "WhatsApp Web Rust (${{ github.event.inputs.release_tag || 'v1.0.0' }}) — Setup Installer & Portable (.exe)"
          body: |
            ## WhatsApp Web Rust — Windows Setup Installer & Portable (`.exe`)
            Aplikasi desktop ringan berbasis **Rust (`tao` + `wry` OS WebView2)** yang membuka langsung **`https://web.whatsapp.com`** dengan ikon WhatsApp resmi dan pengaturan lokasi penyimpanan.

            ### Pilihan File Unduhan:
            1. **`WhatsApp-Rust-Setup.exe` (Direkomendasikan — Installer Wizard)**:
               - Dilengkapi **Pemilih Lokasi Penyimpanan (`Browse...`)** untuk memilih drive/folder instalasi (misal `C:\...`, `D:\WhatsAppRust`, dll.).
               - Seluruh data sesi login WhatsApp Web & cache otomatis disimpan di folder yang Anda pilih (`<FolderPilihan>\webview2-profile`) sehingga tidak memenuhi drive C.
               - Otomatis membuat shortcut **WhatsApp** di Desktop & Start Menu lengkap dengan ikon WhatsApp serta fitur Uninstall.
            2. **`whatsapp-rust.exe` (Versi Portable)**:
               - Langsung klik dua kali tanpa instalasi; menyimpan data sesi secara lokal di folder yang sama (`./webview2-profile`).
          draft: false
          prerelease: false
          files: |
            dist-release/WhatsApp-Rust-Setup.exe
            dist-release/whatsapp-rust.exe
            dist-release/whatsapp-rust-win64-portable.zip
            dist-release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
