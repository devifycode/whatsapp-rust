[package]
name = "whatsapp-rust"
version = "1.0.0"
edition = "2021"
authors = ["WhatsApp Rust Contributors"]
description = "Ultra-lightweight Rust Native Wrapper (.exe) for WhatsApp Web (https://web.whatsapp.com) using OS WebView2"
license = "MIT"
build = "build.rs"

[[bin]]
name = "whatsapp-rust"
path = "src-rust/main.rs"

[dependencies]
# Native cross-platform windowing & OS WebView2 engine (Tauri core crates)
tao = "0.30"
wry = "0.47"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Ultra-small, fast Windows .exe binary optimization profile (~1.8 MB .exe)
[profile.release]
opt-level = "z"       # Optimize aggressively for binary size
lto = true            # Enable full Link-Time Optimization
codegen-units = 1     # Maximize dead-code elimination
panic = "abort"       # Strip unwinding tables for smaller footprint
strip = true          # Automatically strip debug symbols from .exe
